name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client, dashboard]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: Build
        run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - "27017:27017"

    defaults:
      run:
        working-directory: server
    env:
      PORT: 5500
      MONGODB_URL: mongodb://localhost:27017/Zerodha
      FRONTEND_URL: http://localhost:4000
      NODE_ENV: development
      ACCESS_TOKEN_SECRET: ci-only-access-secret
      ACCESS_TOKEN_EXPIRY: 1d
      REFRESH_TOKEN_SECRET: ci-only-refresh-secret
      REFRESH_TOKEN_EXPIRY: 7d

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Smoke test
        run: |
          node src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "Database Connected" server.log && break
            sleep 1
          done
          cat server.log
          curl --fail http://localhost:5500/health
