name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client, dashboard]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: Build
        run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - "27017:27017"

    defaults:
      run:
        working-directory: server
    env:
      PORT: 5500
      MONGODB_URL: mongodb://localhost:27017/Zerodha
      FRONTEND_URL: http://localhost:4000
      NODE_ENV: development
      ACCESS_TOKEN_SECRET: ci-only-access-secret
      ACCESS_TOKEN_EXPIRY: 1d
      REFRESH_TOKEN_SECRET: ci-only-refresh-secret
      REFRESH_TOKEN_EXPIRY: 7d

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Smoke test
        run: |
          node src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "Database Connected" server.log && break
            sleep 1
          done
          cat server.log
          curl --fail http://localhost:5500/health

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: server
            args: ""

          - app: dashboard
            args: "--build-arg VITE_BASE_URL=http://localhost:5500"

          - app: client
            args: "--build-arg VITE_DASHBOARD_URL=http://localhost:4000"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build ${{ matrix.app }} image
        run: docker build ${{ matrix.args }} -t ${{ matrix.app }}:ci ./${{ matrix.app }}

  publish:
    needs: [frontend, server, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: server
            build_args: ""

          - app: dashboard
            build_args: VITE_BASE_URL=${{ vars.VITE_BASE_URL }}

          - app: client
            build_args: VITE_DASHBOARD_URL=${{ vars.VITE_DASHBOARD_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zerodha-${{ matrix.app }}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          build_args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
