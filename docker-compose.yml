services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - "5500:5500"
    env_file: ./server/.env
    environment:
      MONGODB_URL: mongodb://mongo:27017/Zerodha
      PORT: 5500
      NODE_ENV: development
      FRONTEND_URL: http://localhost:4000
    depends_on:
      - mongo

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_BASE_URL: http://localhost:5500
    ports:
      - "4000:80"

  client:
    build:
      context: ./client
      args:
        VITE_DASHBOARD_URL: http://localhost:4000
    ports:
      - "3000:80"

volumes:
  mongo-data:
